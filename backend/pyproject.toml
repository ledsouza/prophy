[tool.poetry]
name = "prophy"
version = "0.1.0"
description = "Aplicação Web para atendimentos de clientes no setor da física médica"
authors = ["ledsouza <leandro.souza.159@gmail.com>"]
license = "GPL-3.0-only"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
Django = "^5.2"
djangorestframework = "^3.15.2"
Markdown = "^3.6"
django-cors-headers = "^4.4.0"
python-dotenv = "^1.2.2"
djangorestframework-simplejwt = "^5.5.1"
djoser = "^2.3.0"
pillow = "^12.2.0"
localflavor = "^1.9"
faker = "^40.0.0"
validate-docbr = "^2.0.0"
django-filter = "^24.3"
drf-yasg = "^1.21.7"
setuptools = "^83.0.0"
aiosmtpd = "^1.4.6"
django-ses = "^4.3.0"
mailgun = "^1.1.0"
django-anymail = {version = "^15.0", extras = ["mailgun"]}
google-auth = "^2.40.3"
reportlab = "^4.4.3"
pydantic = "^2.11.7"
phonenumbers = "^9.0.12"
django-storages = {extras = ["google"], version = "^1.14.6"}
psycopg = {extras = ["binary"], version = "^3.2.10"}
whitenoise = "^6.10.0"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.30.1"
pytest-django = "^4.11.1"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.8.0"
pytest-mock = "^3.15.1"
factory-boy = "^3.3.1"
django-cypress = "^1.0.1"
pdfplumber = "^0.11.10"
django-stubs = "^6.0.6"
mypy = "^2.2.0"
djangorestframework-stubs = "^3.17.0"
ruff = "^0.15.21"
docformatter = "^1.7.8"
pyright = "^1.1.411"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.test"
pythonpath = ["."]
testpaths = ["."]
addopts = "-ra --reuse-db --cov=. --cov-report=term-missing"

[tool.coverage.run]
source = ["."]

[tool.coverage.report]
fail_under = 0
show_missing = true

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes (unused imports/vars, undefined names)
    "I",       # isort (import grouping/order)
    "UP",      # pyupgrade (builtin generics, `X | None` over Optional[X])
    "B",       # bugbear (common bug patterns, mutable defaults)
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "N",       # pep8-naming (snake_case/PascalCase/UPPER_CASE)
    "D",       # pydocstyle
    "PLW0603", # no `global` statement
    "PLR0913", # too many function arguments
    "PLR2004", # magic value comparison
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pylint]
max-args = 3

[tool.ruff.lint.isort]
known-first-party = ["core", "users", "clients_management", "requisitions", "materials"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
python_version = "3.12"
files = ["."]
exclude = [
    "/migrations/",
    "^\\.venv/",
    "^media/",
    "^static/",
    "^templates/",
]

check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "anymail.*",
    "localflavor.*",
    "validate_docbr.*",
    "phonenumbers.*",
    "factory.*",
    "djoser.*",
    "drf_yasg.*",
    "reportlab.*",
    "dateutil.*",
    "django_filters.*",
]
ignore_missing_imports = true

# factory_boy ships no type stubs: calling a DjangoModelFactory
# subclass is statically typed as returning the factory class itself,
# not the model instance it produces at runtime. This makes every
# attribute/kwarg on a factory-built object look wrong to mypy across
# the whole test suite. Narrowly disabling the two error classes this
# causes (instead of excluding tests from checking altogether) keeps
# real logic bugs in test files visible.
[[tool.mypy.overrides]]
module = [
    "conftest",
    "*.tests.*",
    "tests.*",
]
disable_error_code = [
    "attr-defined",
    "arg-type",
    "comparison-overlap",
    "misc",
    "assignment",
    "operator",
]

[tool.django-stubs]
django_settings_module = "core.settings.base"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
