services:
  backend:
    image: prophy-backend:prod
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod

  frontend:
    image: prophy-frontend:prod
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build
      # time, so this must be a build arg, not a runtime `environment:`
      # entry (those only affect the container after the bundle is
      # already built and have no effect on NEXT_PUBLIC_* values).
      args:
        NEXT_PUBLIC_HOST: http://proxy:8080

  proxy:
    image: nginx:1.27-alpine

  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: prophy
      POSTGRES_USER: prophy
      POSTGRES_PASSWORD: prophy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prophy -d prophy"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
